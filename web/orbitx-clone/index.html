<!-- GBT v5.0 后端融合 — 钱包·资金池·卡发行·API             -->
<!-- ═══════════════════════════════════════════════════════ -->
<style>
.gbt-fusion-panel {
  position:fixed; bottom:20px; right:20px; z-index:9999;
  background:rgba(10,10,15,0.92); border:1px solid rgba(255,255,255,0.1);
  border-radius:16px; backdrop-filter:blur(20px); padding:16px;
  font-family:'Inter Display',sans-serif; color:#fff; width:280px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5); transition:all 0.3s;
}
.gbt-fusion-panel.collapsed { width:48px; height:48px; padding:12px; overflow:hidden; border-radius:50%; }
.gbt-panel-toggle { position:absolute; top:8px; right:8px; cursor:pointer; opacity:0.5; font-size:12px; }
.gbt-panel-toggle:hover { opacity:1; }
.gbt-balance { font-size:28px; font-weight:600; letter-spacing:-1px; margin:8px 0; }
.gbt-balance span { font-size:12px; opacity:0.5; }
.gbt-btn {
  display:block; width:100%; padding:10px; margin:6px 0; border-radius:50px;
  border:none; cursor:pointer; font-size:13px; font-weight:500; font-family:inherit;
  transition:all 0.2s; text-align:center;
}
.gbt-btn-primary { background:#fff; color:#000; }
.gbt-btn-primary:hover { background:#e0e0e0; transform:translateY(-1px); }
.gbt-btn-outline { background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.2); }
.gbt-btn-outline:hover { border-color:rgba(255,255,255,0.5); }
.gbt-status { font-size:11px; opacity:0.5; text-align:center; margin-top:8px; }
.gbt-status.connected { color:#22c55e; opacity:1; }
.gbt-card-preview {
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  border-radius:12px; padding:16px; margin:10px 0; position:relative; overflow:hidden;
}
.gbt-card-preview::before {
  content:''; position:absolute; top:-50%; right:-50%; width:100%; height:100%;
  background:radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%);
}
.gbt-card-number { font-size:18px; letter-spacing:3px; font-weight:500; }
.gbt-card-name { font-size:11px; opacity:0.7; margin-top:8px; }
.gbt-card-network { position:absolute; top:12px; right:12px; font-size:10px; opacity:0.6; }
</style>
<div class="gbt-fusion-panel collapsed" id="gbt-fusion">
  <div class="gbt-panel-toggle" onclick="toggleFusion()">⊕</div>
  <div style="font-size:11px;opacity:0.5;text-transform:uppercase;letter-spacing:1px;">GBT Fusion Layer</div>
  <div class="gbt-balance" id="gbt-usdc">--<span> USDC</span></div>
  <div class="gbt-card-preview" id="gbt-card" style="display:none">
    <div class="gbt-card-network">VISA SIGNATURE</div>
    <div class="gbt-card-number">---- ---- ---- ----</div>
    <div class="gbt-card-name">OrbitX via GBT</div>
  </div>
  <button class="gbt-btn gbt-btn-primary" onclick="gbtIssueCard()">Issue Virtual Card</button>
  <button class="gbt-btn gbt-btn-outline" onclick="gbtDeposit()">Deposit USDC</button>
  <button class="gbt-btn gbt-btn-outline" onclick="gbtSend()">Send Globally</button>
  <div class="gbt-status" id="gbt-status">connecting...</div>
</div>
<script>
// ═══════════════════════════════════════════════════
// GBT v5.0 后端融合 — 真API · wallet+fund_pool+coin_prices
// web_api port 9120 → wallet.balance/transfer/coin_prices/tx_history
//                     → fund_pool.user_create/deposit/withdraw/pool_status
// ═══════════════════════════════════════════════════
const GBT_API = 'http://localhost:9120/api';
let gbtUserId = localStorage.getItem('gbt_user_id') || '';
let gbtWallet = {balance:0, address:'', connected:false};

async function gbtCall(endpoint, params={}) {
  try {
    const r = await fetch(`${GBT_API}/${endpoint}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id: gbtUserId, ...params})
    });
    return await r.json();
  } catch(e) { return {ok:false, error:e.message}; }
}

async function gbtInit() {
  // Create user if needed
  if (!gbtUserId) {
    const name = 'orbitx_' + Math.random().toString(36).slice(2,8);
    const r = await gbtCall('wallet/balance', {user_id: name});
    // wallet doesn't have user_create, use fund_pool
    const create = await fetch(`${GBT_API}/wallet/balance`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({cap:'fund_pool', action:'user_create', params:{name:name}})
    });
    try {
      const cr = await create.json();
      if (cr.ok && cr.user) {
        gbtUserId = cr.user.id;
        localStorage.setItem('gbt_user_id', gbtUserId);
      }
    } catch(e) {}
    if (!gbtUserId) gbtUserId = name;
    localStorage.setItem('gbt_user_id', gbtUserId);
  }
  // Seed initial balance via fund_pool deposit
  await fetch(`${GBT_API}/wallet/balance`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cap:'fund_pool', action:'deposit', params:{user_id:gbtUserId, amount:5000, currency:'USDC'}})
  }).catch(()=>{});
  gbtRefresh();
}

async function gbtRefresh() {
  // Query wallet balance
  const r = await gbtCall('wallet/balance');
  if (r.ok) {
    gbtWallet = r;
    document.getElementById('gbt-usdc').innerHTML = `${Number(r.balance||0).toLocaleString()}<span> USDC</span>`;
    document.getElementById('gbt-status').textContent = 'connected · GBT v5.0';
    document.getElementById('gbt-status').className = 'gbt-status connected';
  } else {
    // Try fund_pool balance
    const fp = await gbtCall('wallet/balance', {cap:'fund_pool', action:'user_balance'});
    if (fp.ok) {
      document.getElementById('gbt-usdc').innerHTML = `${Number(fp.balance||0).toLocaleString()}<span> USDC</span>`;
      document.getElementById('gbt-status').textContent = 'connected · fund_pool';
      document.getElementById('gbt-status').className = 'gbt-status connected';
    } else {
      document.getElementById('gbt-status').textContent = 'API online · no wallet yet';
    }
  }
  // Query coin prices
  try {
    const prices = await gbtCall('wallet/rates');
    if (prices.ok && prices.prices) {
      gbtWallet.prices = prices.prices;
    }
  } catch(e) {}
}

async function gbtIssueCard() {
  // Generate virtual card number
  const prefix = '4520';
  const segments = Array.from({length:3}, ()=>String(Math.floor(1000+Math.random()*9000)));
  const cardNumber = prefix + ' ' + segments.join(' ');
  document.getElementById('gbt-card').style.display = 'block';
  document.getElementById('gbt-card').querySelector('.gbt-card-number').textContent = cardNumber;
  // Record in fund_pool as a card issuance
  await fetch(`${GBT_API}/wallet/balance`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cap:'fund_pool', action:'deposit', params:{user_id:gbtUserId, amount:0, currency:'CARD_ISSUE', note:cardNumber}})
  }).catch(()=>{});
  alert('Virtual Card Issued: ' + cardNumber + '\nPowered by GBT v5.0 Fund Pool');
}

async function gbtDeposit() {
  const amt = parseFloat(prompt('Deposit amount (USDC):', '100'));
  if (!amt || amt <= 0) return;
  const r = await fetch(`${GBT_API}/wallet/balance`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({cap:'fund_pool', action:'deposit', params:{user_id:gbtUserId, amount:amt, currency:'USDC'}})
  });
  const data = await r.json().catch(()=>({}));
  if (data.ok) {
    alert(`Deposited ${amt} USDC — tx: ${data.tx_id || 'confirmed'}`);
    gbtRefresh();
  }
}

async function gbtSend() {
  const amt = parseFloat(prompt('Amount (USDC):', '100'));
  if (!amt || amt <= 0) return;
  const dest = prompt('Destination (email/phone/wallet):', '');
  if (!dest) return;
  const r = await gbtCall('wallet/transfer', {amount:amt, destination:dest});
  if (r.ok) {
    alert(`Sent ${amt} USDC → ${dest}\nTx: ${r.tx_id || 'confirmed'}`);
    gbtRefresh();
  } else {
    alert('Transfer via fund_pool: ' + amt + ' USDC → ' + dest + '\n(Simulated — wallet transfer needs auth)');
  }
}

function toggleFusion() {
  const p = document.getElementById('gbt-fusion');
  p.classList.toggle('collapsed');
  p.querySelector('.gbt-panel-toggle').textContent = p.classList.contains('collapsed') ? '⊕' : '⊗';
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('a[href*="apps.apple.com"]').forEach(a => {
    a.href = 'javascript:void(0)';
    a.onclick = () => {
      document.getElementById('gbt-fusion').classList.remove('collapsed');
      document.getElementById('gbt-fusion').querySelector('.gbt-panel-toggle').textContent = '⊗';
      gbtRefresh();
    };
  });
  document.querySelectorAll('a[href*="tally.so"]').forEach(a => {
    a.href = 'javascript:void(0)';
    a.onclick = () => { toggleFusion(); gbtRefresh(); };
  });
  gbtInit();
});
