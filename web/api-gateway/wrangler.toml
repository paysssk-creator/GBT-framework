name = "gbt-api-gateway"
main = "index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# ═══════════════ Workflows (持久执行) ═══════════════
[[workflows]]
name = "eye-workflow"
binding = "EYE_WORKFLOW"
class_name = "EyeWorkflow"

[[workflows]]
name = "tunnel-health"
binding = "TUNNEL_HEALTH"
class_name = "TunnelHealthWorkflow"

# ═══════════════ Tail Worker (遥测处理) ═══════════════
[[tail_consumers]]
service = "gbt-telemetry-worker"
environment = "production"

# ═══════════════ Observability ═══════════════
[observability]
enabled = true
head_sampling_rate = 1.0   # 100% tracing for debugging

# ═══════════════ Routes ═══════════════
[[routes]]
pattern = "api.gbtxiaotudou.com/*"
zone_name = "gbtxiaotudou.com"

# ═══════════════ Environment Variables ═══════════════
[vars]
BACKEND_URL = "https://api-tunnel.gbtxiaotudou.com"
AI_GATEWAY_ENABLED = "true"
AI_GATEWAY_ACCOUNT_ID = "82dd88c2a3907846e9797ea95419802f"
AI_GATEWAY_NAME = "gbt-ai-gateway"

# ═══════════════ Rate Limiting ═══════════════
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
