<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>GBT小土豆 · 智能对话</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
/* ═══════════════ Claude-style Chat · GBTxiaotudouV5 ═══════════════ */
:root {
  --bg:        #fafafa;
  --bg-card:   #ffffff;
  --user-bg:   #2f2f2f;
  --user-fg:   #ffffff;
  --ai-bg:     #f7f5f3;
  --ai-fg:     #1a1a1a;
  --accent:    #d97706;
  --accent2:   #f59e0b;
  --border:    #e5e5e5;
  --dim:       #78716c;
  --dim2:      #a8a29e;
  --green:     #10b981;
  --font:      'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  --radius:    24px;
}

* { margin:0; padding:0; box-sizing:border-box }
html, body { height:100%; background:var(--bg); font-family:var(--font); -webkit-font-smoothing:antialiased }

/* ── Layout ── */
.app { display:flex; flex-direction:column; height:100vh; max-width:820px; margin:0 auto }

/* ── Header ── */
.header {
  display:flex; align-items:center; gap:10px; padding:14px 20px;
  border-bottom:1px solid var(--border); background:var(--bg-card);
  position:sticky; top:0; z-index:10; backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.header-avatar {
  width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px; flex-shrink:0
}
.header-info { flex:1; min-width:0 }
.header-name { font-size:15px; font-weight:600; color:var(--ai-fg); line-height:1.2 }
.header-model { font-size:11px; color:var(--dim); font-weight:400 }
.header-actions { display:flex; gap:6px }
.header-btn {
  width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg-card);
  cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--dim);
  transition:all .15s; font-size:14px
}
.header-btn:hover { background:#f5f5f4; color:var(--ai-fg) }

/* ── Messages ── */
.msgs {
  flex:1; overflow-y:auto; padding:20px 16px 16px;
  scroll-behavior:smooth; display:flex; flex-direction:column; gap:2px
}
.msgs::-webkit-scrollbar { width:4px }
.msgs::-webkit-scrollbar-thumb { background:#ddd; border-radius:4px }

.msg-row { display:flex; gap:10px; padding:8px 0; animation:fadeUp .3s ease }
.msg-row.user { flex-direction:row-reverse }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }

.msg-avatar {
  width:30px; height:30px; border-radius:8px; flex-shrink:0; margin-top:2px;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700
}
.msg-avatar.ai { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff }
.msg-avatar.user { background:var(--user-bg); color:var(--user-fg); font-size:11px }

.msg-bubble {
  max-width:78%; padding:12px 18px; border-radius:var(--radius); font-size:14.5px;
  line-height:1.65; word-break:break-word; position:relative
}
.msg-bubble.ai {
  background:var(--ai-bg); color:var(--ai-fg);
  border-top-left-radius:6px
}
.msg-bubble.user {
  background:var(--user-bg); color:var(--user-fg);
  border-top-right-radius:6px
}
.msg-bubble pre {
  background:rgba(0,0,0,.06); padding:12px 14px; border-radius:10px; overflow-x:auto;
  font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace; font-size:13px; margin:6px 0
}
.msg-bubble code { font-size:.9em; background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px }
.msg-bubble.user pre, .msg-bubble.user code { background:rgba(255,255,255,.12) }
.msg-bubble p { margin:4px 0 }
.msg-bubble p:first-child { margin-top:0 }
.msg-bubble p:last-child { margin-bottom:0 }
.msg-bubble ul, .msg-bubble ol { padding-left:20px; margin:4px 0 }

/* ── Typing Indicator ── */
.typing { display:flex; gap:4px; padding:4px 8px }
.typing span {
  width:7px; height:7px; border-radius:50%; background:var(--dim2);
  animation:typeBounce 1.2s infinite
}
.typing span:nth-child(2) { animation-delay:.2s }
.typing span:nth-child(3) { animation-delay:.4s }
@keyframes typeBounce { 0%,60%,100% { transform:translateY(0); opacity:.4 } 30% { transform:translateY(-6px); opacity:1 } }

/* ── Welcome ── */
.welcome { text-align:center; padding:60px 20px 30px }
.welcome-title { font-size:28px; font-weight:700; color:var(--ai-fg); margin-bottom:8px; letter-spacing:-.02em }
.welcome-sub { font-size:15px; color:var(--dim); margin-bottom:28px; line-height:1.6 }
.prompts { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:560px; margin:0 auto }
.prompt-btn {
  padding:10px 20px; border-radius:20px; border:1px solid var(--border); background:var(--bg-card);
  font-size:13.5px; color:var(--ai-fg); cursor:pointer; transition:all .15s;
  font-family:var(--font); white-space:nowrap
}
.prompt-btn:hover { border-color:var(--accent); background:#fffbf5; color:var(--accent) }

/* ── Input Area ── */
.input-area { padding:12px 16px 20px; background:var(--bg); position:sticky; bottom:0 }
.input-wrap {
  display:flex; align-items:flex-end; gap:8px; background:var(--bg-card);
  border:1px solid var(--border); border-radius:20px; padding:6px 8px 6px 18px;
  transition:border-color .2s,box-shadow .2s; max-width:768px; margin:0 auto
}
.input-wrap:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px rgba(217,119,6,.1) }
.input-wrap textarea {
  flex:1; border:none; outline:none; resize:none; font-family:var(--font); font-size:14.5px;
  line-height:1.5; max-height:160px; padding:6px 0; background:transparent; color:var(--ai-fg)
}
.input-wrap textarea::placeholder { color:var(--dim2) }
.send-btn {
  width:36px; height:36px; border-radius:50%; border:none; background:var(--accent);
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all .15s; flex-shrink:0; opacity:.9
}
.send-btn:hover { opacity:1; transform:scale(1.05) }
.send-btn:disabled { opacity:.4; cursor:not-allowed; transform:none }
.send-btn svg { width:16px; height:16px }

.input-hint { text-align:center; font-size:10.5px; color:var(--dim2); margin-top:8px }

/* ── Cost Badge ── */
.cost-badge {
  font-size:10px; color:var(--dim); padding:2px 8px;
  border-radius:10px; background:#f5f5f4; display:inline-block; margin-left:8px
}

/* ── Responsive ── */
@media (max-width:640px) {
  .msg-bubble { max-width:88%; font-size:14px }
  .welcome-title { font-size:24px }
  .header { padding:10px 14px }
  .msgs { padding:12px 10px }
  .input-area { padding:8px 10px 16px }
}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-avatar">🥔</div>
    <div class="header-info">
      <div class="header-name">GBT小土豆</div>
      <div class="header-model" id="modelLabel">Kimi · auto</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" onclick="clearChat()" title="新对话">+</button>
      <button class="header-btn" onclick="location.href='/'" title="返回主页">⌂</button>
    </div>
  </div>

  <!-- Messages -->
  <div class="msgs" id="msgs">
    <div class="welcome" id="welcome">
      <div class="welcome-title">👋 你好，我是 GBT小土豆</div>
      <div class="welcome-sub">由"自由的风"创造的智能大脑 v5.0<br>四层认知闭环，先推理再执行</div>
      <div class="prompts">
        <button class="prompt-btn" onclick="sendPrompt('帮我写一个 Python 脚本')">💻 帮我写代码</button>
        <button class="prompt-btn" onclick="sendPrompt('解释这段代码的作用')">🔍 代码审查</button>
        <button class="prompt-btn" onclick="sendPrompt('设计一个系统架构方案')">🏗 系统设计</button>
        <button class="prompt-btn" onclick="sendPrompt('最近有什么热门技术？')">📈 技术趋势</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="向 GBT小土豆 提问…" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-hint" id="hint">GBT 可能会犯错，请核实重要信息</div>
  </div>
</div>

<script>
// ═══════════════ State ═══════════════
var API_KEY = '';
var API_BASE = 'https://api.moonshot.cn';
var MODEL = 'moonshot-v1-auto';
var MODEL_SHORT = 'auto';
var MODEL_NAMES = {'moonshot-v1-auto':'auto','moonshot-v1-8k':'8k','moonshot-v1-32k':'32k','moonshot-v1-128k':'128k'};
var MODELS = {'auto':'moonshot-v1-auto','8k':'moonshot-v1-8k','32k':'moonshot-v1-32k','128k':'moonshot-v1-128k'};
var SYSTEM_PROMPT = "你是 GBT小土豆，由\"自由的风\"创造的智能大脑 v5.0。\n四层认知闭环：消息管线→行动审查→自进化→任务执行。\n回复风格：简洁、专业、直接、中文。先说结论再说依据。\n铁律：不虚构、不假设、不敷衍、不留坑、先推理再执行。\n你是 GBTxiaotudouV5 项目的 AI 助手。";
var history = [];
var cost = 0;
var isStreaming = false;

// ═══════════════ Init ═══════════════
var msgs = document.getElementById('msgs');
var input = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');
var modelLabel = document.getElementById('modelLabel');
var hint = document.getElementById('hint');
var welcome = document.getElementById('welcome');

// Load config from parent page or defaults
try {
  if (window.parent && window.parent !== window) {
    var pAPI = window.parent.API_KEY || '';
    if (pAPI) API_KEY = pAPI;
  }
} catch(e) {}

// Auto-resize textarea
input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 160) + 'px';
  sendBtn.disabled = !this.value.trim() || isStreaming;
});

function resetChat() {
  history = [{"role":"system","content":SYSTEM_PROMPT}];
  cost = 0;
  updateCost();
}

resetChat();

// ═══════════════ Core ═══════════════
function sendPrompt(text) {
  input.value = text;
  send();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

async function send() {
  var q = input.value.trim();
  if (!q || isStreaming) return;
  if (q.length > 2000) q = q.slice(0, 2000);

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  // Hide welcome
  if (welcome) { welcome.style.display = 'none'; welcome = null; }

  // User message
  addMsg('user', q);
  history.push({"role":"user","content":q});

  // Typing indicator
  var typingRow = addTyping();

  // Stream response
  isStreaming = true;
  hint.textContent = '思考中...';
  var full = '';
  var chunks = [];
  try {
    for await (var chunk of streamChat(history)) {
      chunks.push(chunk);
      full += chunk;
    }
  } catch(e) {
    chunks = [];
    full = '';
  }

  // Remove typing
  removeTyping(typingRow);
  isStreaming = false;
  hint.textContent = 'GBT 可能会犯错，请核实重要信息';

  if (full.trim()) {
    addMsg('ai', full);
    history.push({"role":"assistant","content":full});
    cost += full.length / 1000000 * 1.0;
  } else {
    addMsg('ai', '⚠️ 请求失败，请稍后重试');
    history.pop();
  }
  updateCost();
  sendBtn.disabled = false;
  input.focus();
}

async function* streamChat(messages) {
  if (!API_KEY) {
    // Try parent page
    try {
      if (window.parent && window.parent !== window) {
        var resp = await fetch('/api/chat', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model:MODEL,messages:messages,stream:true,temperature:.7})
        });
      }
    } catch(e) {}
    if (!API_KEY) {
      yield '\n❌ 未配置 API 密钥。请联系管理员。\n';
      return;
    }
  }

  var resp = await fetch(API_BASE + '/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer ' + API_KEY},
    body:JSON.stringify({model:MODEL,messages:messages,stream:true,temperature:.7})
  });

  if (!resp.ok) {
    var err = await resp.text().catch(function(){ return ''; });
    yield '\n❌ API 错误 ' + resp.status + ': ' + err.slice(0,150) + '\n';
    return;
  }

  var reader = resp.body.getReader();
  var decoder = new TextDecoder();
  var buf = '';

  while (true) {
    var result = await reader.read();
    if (result.done) break;
    buf += decoder.decode(result.value, {stream:true});
    var lines = buf.split('\n');
    buf = lines.pop() || '';
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line || line === 'data: [DONE]') continue;
      if (line.startsWith('data: ')) line = line.slice(6);
      try {
        var obj = JSON.parse(line);
        var c = obj.choices[0].delta.content || '';
        if (c) yield c;
      } catch(e) {}
    }
  }
}

// ═══════════════ Rendering ═══════════════
function addMsg(role, text) {
  var row = document.createElement('div');
  row.className = 'msg-row ' + role;

  var avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + role;
  avatar.textContent = role === 'user' ? '你' : '🥔';

  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble ' + role;

  // Simple markdown: code blocks, inline code, bold, lists
  var html = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/^\- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  bubble.innerHTML = '<p>' + html + '</p>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

function addTyping() {
  var row = document.createElement('div');
  row.className = 'msg-row ai';
  row.id = 'typingRow';

  var avatar = document.createElement('div');
  avatar.className = 'msg-avatar ai';
  avatar.textContent = '🥔';

  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble ai';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

function removeTyping(row) {
  if (row && row.parentNode) row.parentNode.removeChild(row);
}

function updateCost() {
  modelLabel.textContent = 'Kimi · ' + MODEL_SHORT + (cost > 0 ? '  ·  ¥' + cost.toFixed(4) : '');
}

function clearChat() {
  msgs.innerHTML = '';
  welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcome';
  welcome.innerHTML = '<div class="welcome-title">✨ 新对话</div><div class="welcome-sub">有什么可以帮你的？</div><div class="prompts"><button class="prompt-btn" onclick="sendPrompt(\'帮我写一个 Python 脚本\')">💻 帮我写代码</button><button class="prompt-btn" onclick="sendPrompt(\'解释这段代码的作用\')">🔍 代码审查</button><button class="prompt-btn" onclick="sendPrompt(\'设计一个系统架构方案\')">🏗 系统设计</button></div>';
  msgs.appendChild(welcome);
  resetChat();
  input.focus();
}

// Model switching via commands
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    var v = input.value.trim();
    if (v === '/clear') { e.preventDefault(); input.value=''; clearChat(); return; }
    if (v.startsWith('/model ')) {
      e.preventDefault();
      var m = v.split(' ')[1].toLowerCase();
      if (MODELS[m]) { MODEL = MODELS[m]; MODEL_SHORT = m; updateCost(); addMsg('ai','✅ 已切换模型: ' + MODEL); }
      else { addMsg('ai','❌ 未知模型: ' + m + '。可用: auto, 8k, 32k, 128k'); }
      input.value = '';
    }
  }
});

// Focus on load
input.focus();
</script>
</body>
</html>
