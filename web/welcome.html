<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>欢迎来到AI世界的8号当铺</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000;font-family:"Microsoft YaHei",Arial,sans-serif}
canvas{display:block}
#title{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#00e5ff;font-size:clamp(24px,5vw,48px);font-weight:bold;text-shadow:0 0 10px #00e5ff,0 0 20px #00e5ff,0 0 30px #0088ff;z-index:10;opacity:0;white-space:nowrap;letter-spacing:2px}
#subtitle{position:fixed;top:62%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:clamp(12px,2.5vw,18px);z-index:10;opacity:0;white-space:nowrap}
#enter{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:12px 40px;border:2px solid #00e5ff;border-radius:30px;background:rgba(0,229,255,.1);color:#00e5ff;font-size:18px;cursor:pointer;z-index:20;opacity:0;transition:all .3s;letter-spacing:2px}
#enter:hover{background:rgba(0,229,255,.25);box-shadow:0 0 30px rgba(0,229,255,.4)}
#skip{position:fixed;top:20px;right:20px;color:rgba(255,255,255,.4);font-size:13px;cursor:pointer;z-index:20;background:none;border:none}
</style>
</head>
<body>
<div id="title">欢迎来到AI世界的8号当铺</div>
<div id="subtitle">AI界的8号当铺 · 贴个链接 AI替你打工</div>
<button id="enter" onclick="goMain()">进入平台</button>
<button id="skip" onclick="goMain()">跳过 ▸</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
function goMain(){window.location.href='/index.html'}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050b18);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
camera.position.set(0,0,8);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const vertexShader=`varying vec2 vUv;varying vec3 vPos;uniform float time;
void main(){vUv=uv;vPos=position;vec3 p=position;p.x+=sin(time*1.5+position.y*2.)*.15;p.y+=cos(time*1.2+position.x*2.)*.15;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`;

const fragmentShader=`varying vec2 vUv;varying vec3 vPos;uniform float time;
void main(){float a=.6+sin(time+vUv.x*6.)*.35;vec3 c1=vec3(0,.6,1.);vec3 c2=vec3(.2,0,.8);vec3 c3=vec3(0,1.,1.);float m1=sin(vUv.x*3.+time)*.5+.5;float m2=cos(vUv.y*3.+time)*.5+.5;vec3 c=mix(c1,c2,m1);c=mix(c,c3,m2);gl_FragColor=vec4(c,a);}`;

const heroMat=new THREE.ShaderMaterial({vertexShader,fragmentShader,uniforms:{time:{value:0}},transparent:true});
const doorGeo=new THREE.BoxGeometry(3.2,4.2,.6);
const door=new THREE.Mesh(doorGeo,heroMat);
scene.add(door);

const lineGeo=new THREE.EdgesGeometry(doorGeo);
const lineMat=new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:.85});
door.add(new THREE.LineSegments(lineGeo,lineMat));

const pCount=800;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(pCount*3);
const pCol=new Float32Array(pCount*3);
for(let i=0;i<pCount;i++){pPos[i*3]=(Math.random()-.5)*12;pPos[i*3+1]=(Math.random()-.5)*8;pPos[i*3+2]=(Math.random()-.5)*10-5;pCol[i*3]=0;pCol[i*3+1]=Math.random()*.5+.5;pCol[i*3+2]=1}
pGeo.setAttribute("position",new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute("color",new THREE.BufferAttribute(pCol,3));
const pMat=new THREE.PointsMaterial({size:.08,vertexColors:true,transparent:true,opacity:.6});
const pSys=new THREE.Points(pGeo,pMat);
scene.add(pSys);

const grid=new THREE.GridHelper(30,30,0x00e5ff,0x004488);
grid.position.y=-2.5;grid.material.opacity=.3;grid.material.transparent=true;
scene.add(grid);

scene.add(new THREE.AmbientLight(0xffffff,.6));
const ptLight=new THREE.PointLight(0x00e5ff,1.2,20);
ptLight.position.set(0,0,5);scene.add(ptLight);

const title=document.getElementById("title");
const subtitle=document.getElementById("subtitle");
const enter=document.getElementById("enter");

setTimeout(()=>{title.style.transition="opacity 1.5s ease";title.style.opacity="1";subtitle.style.transition="opacity 1.5s ease";subtitle.style.opacity=".8"},2500);
setTimeout(()=>{enter.style.transition="opacity 1s ease";enter.style.opacity="1"},4000);

const start=Date.now();
function animate(){
  requestAnimationFrame(animate);
  const t=Math.min((Date.now()-start)/1000,10);
  heroMat.uniforms.time.value=t;
  door.rotation.y=Math.sin(t*.8)*.15;
  door.rotation.x=Math.cos(t*.6)*.08;
  door.scale.setScalar(1+Math.sin(t*2)*.06);
  lineMat.opacity=.6+Math.sin(t*3)*.35;
  pSys.rotation.y+=.002;
  pSys.position.z=Math.sin(t*.5)*2;
  camera.position.z=8-t*.35;
  camera.position.x=Math.sin(t*.8)*.5;
  camera.position.y=Math.cos(t*.6)*.3;
  renderer.render(scene,camera);
  if(t>=10){setTimeout(goMain,2000)}
}
animate();

window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
