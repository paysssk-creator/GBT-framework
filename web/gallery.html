<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBT Brain Runtime — Design Showcase</title>
<style>
:root{--bg:#060610;--card:rgba(255,255,255,0.025);--border:rgba(255,255,255,0.05);--text:#ddd;--muted:#666}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;overflow-x:hidden}
canvas{position:fixed;top:0;left:0;z-index:0;pointer-events:none}
.main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:0 20px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:24px 0;position:sticky;top:0;z-index:10;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(6,6,16,0.7)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo svg{width:28px;height:28px;color:#00d4ff}
.logo span{font-weight:700;font-size:1.1rem}

/* Hero */
.hero{padding:60px 0 40px;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:900;line-height:1.15;margin-bottom:12px}
.gradient-text{background:linear-gradient(135deg,#00d4ff,#a855f7,#ffd700);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:grad 4s ease infinite}
@keyframes grad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero p{color:var(--muted);font-size:1.1rem;max-width:500px;margin:0 auto;line-height:1.6}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:20px 0 40px}
.filter{padding:8px 20px;border-radius:100px;font-size:0.82rem;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all 0.25s;backdrop-filter:blur(8px)}
.filter:hover,.filter.active{color:#00d4ff;border-color:rgba(0,212,255,0.3);background:rgba(0,212,255,0.08)}

/* Masonry */
.masonry{columns:3 280px;column-gap:20px;padding-bottom:60px}
.card{break-inside:avoid;margin-bottom:20px;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--border);transition:all 0.4s;cursor:pointer;opacity:0;transform:translateY(40px)}
.card.visible{opacity:1;transform:translateY(0)}
.card:hover{transform:translateY(-4px)!important;border-color:rgba(0,212,255,0.25);box-shadow:0 20px 60px rgba(0,212,255,0.05)}
.card img{width:100%;display:block;transition:transform 0.6s}
.card:hover img{transform:scale(1.03)}
.card-body{padding:16px}
.card-body h3{font-size:0.95rem;font-weight:600;margin-bottom:6px;color:var(--text)}
.card-body .meta{display:flex;align-items:center;justify-content:space-between;font-size:0.75rem;color:var(--muted)}
.card-body .avatar{width:24px;height:24px;border-radius:50%;border:1px solid var(--border)}
.card-body .stats{display:flex;align-items:center;gap:12px}
.card-body .stats span{display:flex;align-items:center;gap:4px}

/* Feature grid */
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:60px 0}
.feat{text-align:center;padding:32px 20px;background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(12px);transition:all 0.4s;opacity:0;transform:translateY(30px)}
.feat.visible{opacity:1;transform:translateY(0)}
.feat:hover{border-color:rgba(0,212,255,0.3);transform:translateY(-4px)!important}
.feat .icon{font-size:2.2rem;margin-bottom:10px}
.feat h3{font-size:0.9rem;margin-bottom:6px}
.feat p{font-size:0.75rem;color:var(--muted)}

/* CTA */
.cta{text-align:center;padding:60px 0 80px}
.cta a{display:inline-block;padding:14px 40px;border-radius:14px;font-size:1rem;font-weight:600;text-decoration:none;color:#00d4ff;border:1px solid rgba(0,212,255,0.3);background:rgba(0,212,255,0.06);transition:all 0.3s;animation:pulse 2s infinite}
.cta a:hover{background:rgba(0,212,255,0.12);box-shadow:0 0 40px rgba(0,212,255,0.15)}
@keyframes pulse{0%,100%{box-shadow:0 0 5px rgba(0,212,255,0.1)}50%{box-shadow:0 0 25px rgba(0,212,255,0.25)}}

footer{text-align:center;padding:40px 20px;color:#444;font-size:0.8rem;border-top:1px solid var(--border)}
footer a{color:#00d4ff;text-decoration:none}

@media(max-width:768px){.masonry{columns:2 160px}.features{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="main">
  <header class="header">
    <a href="/" class="logo">
      <svg viewBox="0 0 32 32" fill="none"><path d="M0 .38C0 .17.17 0 .38 0H22c5.52 0 10 4.48 10 10s-4.48 10-10 10H0V.38Z" fill="currentColor"/><rect y="20" width="32" height="12" fill="currentColor"/></svg>
      <span>GBT Brain</span>
    </a>
    <a href="https://github.com/paysssk-creator/GBT-brain-runtime" style="color:var(--muted);text-decoration:none;font-size:0.85rem">GitHub →</a>
  </header>

  <section class="hero">
    <h1 class="gradient-text">AI Brain<br>Runtime</h1>
    <p>三脑驱动 · 190能力模块 · 视觉皮层 · 量子邻域<br>开源智能体操作系统</p>
  </section>

  <div class="filters">
    <button class="filter active" data-filter="all">全部</button>
    <button class="filter" data-filter="brain">🧠 大脑</button>
    <button class="filter" data-filter="vision">👁️ 视觉</button>
    <button class="filter" data-filter="3d">🌐 3D</button>
    <button class="filter" data-filter="quantum">⚛️ 量子</button>
  </div>

  <div class="masonry" id="grid"></div>

  <section class="features" id="features"></section>

  <div class="cta">
    <a href="https://github.com/paysssk-creator/GBT-brain-runtime">⭐ Star on GitHub</a>
  </div>

  <footer>Built with 🧠 by 自由的风 · MIT License · <a href="https://github.com/paysssk-creator/GBT-brain-runtime">GitHub</a></footer>
</div>

<script type="module">
import * as THREE from 'three';

// ═══ 3D 粒子背景 ═══
const isMobile=/Mobi|Android/i.test(navigator.userAgent);
const count=isMobile?400:1500;
const c=document.getElementById('c');
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
cam.position.z=5;
const r=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:!isMobile});
r.setSize(innerWidth,innerHeight);
r.setPixelRatio(Math.min(devicePixelRatio,isMobile?1:2));

const g=new THREE.BufferGeometry();
const p=new Float32Array(count*3),cl=new Float32Array(count*3);
const rings=isMobile?2:3;
for(let i=0;i<count;i++){
  const ri=i%rings,rad=2.5+ri*0.35,a=(i/count)*Math.PI*2*(ri+1),y=(Math.random()-.5)*.6*(ri+1);
  p[i*3]=Math.cos(a)*rad;p[i*3+1]=y;p[i*3+2]=Math.sin(a)*rad;
  const cc=new THREE.Color();cc.setHSL(.55+ri*.04,.7,.45+Math.random()*.25);
  cl[i*3]=cc.r;cl[i*3+1]=cc.g;cl[i*3+2]=cc.b;
}
g.setAttribute('position',new THREE.BufferAttribute(p,3));
g.setAttribute('color',new THREE.BufferAttribute(cl,3));
const pts=new THREE.Points(g,new THREE.PointsMaterial({size:isMobile?.04:.018,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(pts);
(function anim(){requestAnimationFrame(anim);pts.rotation.x+=.0002;pts.rotation.y+=.0004;r.render(scene,cam)})();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script>

<script>
// ═══ 卡片数据 ═══
const items=[
  {tag:'brain',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280"><rect fill="#0a0a1a" width="400" height="280"/><circle cx="200" cy="120" r="50" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.8"/><circle cx="200" cy="120" r="70" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.5"/><circle cx="200" cy="120" r="90" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/><text x="200" y="125" text-anchor="middle" fill="#00d4ff" font-size="28">🧠</text><text x="200" y="230" text-anchor="middle" fill="#888" font-size="13">三脑协作引擎</text></svg>'),title:'三脑驱动架构',author:'GBT Core',likes:128},
  {tag:'brain',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320"><rect fill="#0a0a1a" width="400" height="320"/><rect x="60" y="40" width="120" height="50" rx="8" fill="none" stroke="#00d4ff" stroke-width="1"/><text x="120" y="70" text-anchor="middle" fill="#00d4ff" font-size="13">推理脑</text><rect x="140" y="130" width="120" height="50" rx="8" fill="none" stroke="#a855f7" stroke-width="1"/><text x="200" y="160" text-anchor="middle" fill="#a855f7" font-size="13">设计脑</text><rect x="60" y="220" width="120" height="50" rx="8" fill="none" stroke="#ffd700" stroke-width="1"/><text x="120" y="250" text-anchor="middle" fill="#ffd700" font-size="13">编程脑</text><line x1="180" y1="65" x2="200" y2="130" stroke="#666"/><line x1="200" y1="180" x2="180" y2="220" stroke="#666"/></svg>'),title:'推理→设计→执行 流水线',author:'Pipeline',likes:96},
  {tag:'vision',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect fill="#0a0a1a" width="400" height="300"/><rect x="80" y="80" width="240" height="150" rx="12" fill="none" stroke="#00d4ff" stroke-width="1.5"/><circle cx="200" cy="155" r="30" fill="none" stroke="#22c55e" stroke-width="1.5"/><circle cx="200" cy="155" r="8" fill="#22c55e"/><text x="200" y="270" text-anchor="middle" fill="#888" font-size="13">VisualCortex · 三层分析</text></svg>'),title:'视觉皮层 L1→L2→L3',author:'VisualCortex',likes:85},
  {tag:'vision',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260"><rect fill="#0a0a1a" width="400" height="260"/><rect x="40" y="40" width="140" height="80" rx="8" fill="none" stroke="#00d4ff" stroke-width="1"/><text x="110" y="85" text-anchor="middle" fill="#00d4ff" font-size="12">截屏 mss</text><rect x="220" y="40" width="140" height="80" rx="8" fill="none" stroke="#a855f7" stroke-width="1"/><text x="290" y="85" text-anchor="middle" fill="#a855f7" font-size="12">OCR Tesseract</text><rect x="40" y="150" width="140" height="80" rx="8" fill="none" stroke="#22c55e" stroke-width="1"/><text x="110" y="195" text-anchor="middle" fill="#22c55e" font-size="12">定位 find()</text><rect x="220" y="150" width="140" height="80" rx="8" fill="none" stroke="#ffd700" stroke-width="1"/><text x="290" y="195" text-anchor="middle" fill="#ffd700" font-size="12">皮层分析</text></svg>'),title:'纯本地视觉管线',author:'Eyes + OCR',likes:72},
  {tag:'3d',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect fill="#0a0a1a" width="400" height="300"/><circle cx="200" cy="120" r="60" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4,2"/><circle cx="200" cy="120" r="75" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/><circle cx="170" cy="100" r="3" fill="#ffd700"/><circle cx="230" cy="80" r="3" fill="#22c55e"/><circle cx="240" cy="140" r="3" fill="#ffd700"/><circle cx="180" cy="150" r="3" fill="#22c55e"/><text x="200" y="230" text-anchor="middle" fill="#888" font-size="13">声明式 3D 引擎</text></svg>'),title:'data-gbt3d 声明式3D',author:'gbt-3d.js',likes:156},
  {tag:'3d',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280"><rect fill="#0a0a1a" width="400" height="280"/><circle cx="200" cy="120" r="55" fill="none" stroke="#00d4ff" stroke-width="1.5"/><text x="200" y="115" text-anchor="middle" fill="#00d4ff" font-size="10">R3F</text><text x="200" y="130" text-anchor="middle" fill="#a855f7" font-size="10">Framer Motion</text><text x="200" y="145" text-anchor="middle" fill="#ffd700" font-size="10">Shadcn/ui</text><text x="200" y="220" text-anchor="middle" fill="#888" font-size="13">React 轨道</text></svg>'),title:'R3F + Framer Motion + Shadcn',author:'gbt-3d-react.js',likes:89},
  {tag:'quantum',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect fill="#0a0a1a" width="400" height="300"/><rect x="80" y="60" width="240" height="180" rx="16" fill="none" stroke="#22c55e" stroke-width="1.5"/><text x="200" y="90" text-anchor="middle" fill="#22c55e" font-size="14">🪞 MirrorFusion</text><line x1="200" y1="100" x2="200" y2="115" stroke="#444"/><text x="200" y="130" text-anchor="middle" fill="#888" font-size="11">① VisionBridge</text><text x="200" y="150" text-anchor="middle" fill="#888" font-size="11">② BypassLLM</text><text x="200" y="170" text-anchor="middle" fill="#888" font-size="11">③ SandboxExecutor</text><text x="200" y="190" text-anchor="middle" fill="#888" font-size="11">④ Ablation</text><text x="200" y="210" text-anchor="middle" fill="#888" font-size="11">⑤ Replay</text></svg>'),title:'镜像多维度空间',author:'MirrorFusion',likes:67},
  {tag:'quantum',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280"><rect fill="#0a0a1a" width="400" height="280"/><circle cx="120" cy="120" r="30" fill="none" stroke="#a855f7" stroke-width="1"/><text x="120" y="125" text-anchor="middle" fill="#a855f7" font-size="10">叠加态</text><circle cx="280" cy="120" r="30" fill="none" stroke="#ffd700" stroke-width="1"/><text x="280" y="125" text-anchor="middle" fill="#ffd700" font-size="10">坍缩</text><line x1="150" y1="120" x2="250" y2="120" stroke="#666" stroke-dasharray="4,4"/><text x="200" y="200" text-anchor="middle" fill="#888" font-size="13">量子邻域 · 7模块</text></svg>'),title:'量子推理 + 纠缠桥接',author:'Quantum',likes:54},
];

// ═══ 渲染 ═══
const grid=document.getElementById('grid');
function renderCards(tag='all'){
  grid.innerHTML='';
  items.filter(i=>tag==='all'||i.tag===tag).forEach((item,i)=>{
    const div=document.createElement('div');
    div.className='card';div.style.transitionDelay=i*80+'ms';
    div.innerHTML=`<img src="${item.img}" alt="${item.title}" loading="lazy"><div class="card-body"><h3>${item.title}</h3><div class="meta"><span style="display:flex;align-items:center;gap:6px"><span class="avatar" style="background:#${Math.random().toString(16).slice(2,8)};display:inline-block"></span>${item.author}</span><span>❤️ ${item.likes}</span></div></div>`;
    grid.appendChild(div);
    setTimeout(()=>div.classList.add('visible'),50);
  });
}
renderCards();

// ═══ 过滤器 ═══
document.querySelectorAll('.filter').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
});

// ═══ Features ═══
const features=[
  {icon:'🧠',title:'推理脑',desc:'DeepSeek实时对话',color:'#00d4ff'},
  {icon:'🎯',title:'设计脑',desc:'自主调度中枢',color:'#a855f7'},
  {icon:'⚡',title:'编程脑',desc:'15层闭环执行',color:'#ffd700'},
  {icon:'👁️',title:'视觉皮层',desc:'纯本地OCR',color:'#22c55e'},
  {icon:'🪞',title:'镜像空间',desc:'5层安全实验',color:'#22c55e'},
  {icon:'⚛️',title:'量子邻域',desc:'7模块叠加态',color:'#a855f7'},
  {icon:'🌐',title:'3D引擎',desc:'声明式标签',color:'#00d4ff'},
  {icon:'🔧',title:'190 Caps',desc:'全邻域拓扑',color:'#ffd700'},
];
const featContainer=document.getElementById('features');
features.forEach((f,i)=>{
  const d=document.createElement('div');
  d.className='feat';d.style.transitionDelay=i*60+'ms';
  d.innerHTML=`<div class="icon">${f.icon}</div><h3 style="color:${f.color}">${f.title}</h3><p>${f.desc}</p>`;
  featContainer.appendChild(d);
  setTimeout(()=>d.classList.add('visible'),100);
});

// ═══ 滚动观察 ═══
const obs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}});
},{threshold:0.1});
setTimeout(()=>document.querySelectorAll('.card,.feat').forEach(el=>obs.observe(el)),200);
</script>
