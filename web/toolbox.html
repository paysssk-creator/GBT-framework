<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style>/* ══════════════════════════════════════════════
   GBT小土豆 · Shared Design System v5.0
   ══════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
:root {
  /* Palette */
  --bg: #000;
  --bg2: #08080c;
  --bg3: #111118;
  --fg: #f5f5f7;
  --dim: #86868b;
  --accent: #ff6b35;
  --accent2: #ff9a56;
  --blue: #2997ff;
  --blue2: #3b82f6;
  --purple: #7c3aed;
  --teal: #0d9488;
  --green: #30d158;
  --red: #ff4757;
  --cyan: #06b6d4;
  --amber: #f59e0b;
  --violet: #8b5cf6;
  --pink: #ec4899;
  --indigo: #6366f1;
  --emerald: #10b981;
  --rose: #f43f5e;

  /* Borders & Surfaces */
  --border: rgba(255, 255, 255, .06);
  --border-strong: rgba(255, 255, 255, .10);
  --glass-bg: rgba(255, 255, 255, .02);
  --glass-border: rgba(255, 255, 255, .06);

  /* Radii */
  --radius: 18px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --radius-lg: 24px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(0,0,0,.25);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 24px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
  --shadow-lift: 0 8px 32px rgba(0,0,0,.5);
  --shadow-lift-sm: 0 8px 32px rgba(0,0,0,.3);
  --shadow-lift-md: 0 8px 32px rgba(0,0,0,.4);
  --shadow-card-hover: 0 12px 40px rgba(0,0,0,.4);
  --shadow-xl: 0 16px 48px rgba(0,0,0,.45);
  --shadow-2xl: 0 20px 60px rgba(0,0,0,.35);
  --shadow-glow-orange: 0 0 30px rgba(255,107,53,.15);
  --shadow-glow-teal: 0 0 30px rgba(13,148,136,.15);
  --shadow-glow-purple: 0 0 30px rgba(124,58,237,.15);
  --shadow-glow-blue: 0 0 30px rgba(41,151,255,.15);
  --shadow-glow-green: 0 0 30px rgba(48,209,88,.12);

  /* Typography */
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  /* Spacing Scale */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  --space-3xl: 64px;
  --space-4xl: 96px;
  --space-5xl: 128px;

  /* Section Rhythm */
  --section-sm: 80px;
  --section-md: 120px;
  --section-lg: 160px;
  --section-xl: 200px;

  /* Transitions */
  --ease-out-expo: cubic-bezier(.16,1,.3,1);
  --ease-out-quint: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --duration-fast: 150ms;
  --duration-base: 250ms;
  --duration-slow: 400ms;
  --duration-glacial: 700ms;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background:
    radial-gradient(circle, rgba(255,255,255,.03) 1px, transparent 1px),
    var(--bg);
  background-size: 20px 20px;
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'ss02';
  letter-spacing: -.01em;
  animation: pageIn .5s var(--ease-out-expo) both;
}


/* ── Skip-to-Content ─────────────── */
.skip-link { position: absolute; top: -100px; left: 8px; z-index: 9999; }
.skip-link:focus { top: 8px; }
/* ── Typography ───────────────────── */
h1, .h1 { font-size: clamp(36px, 5.5vw, 56px); font-weight: 800; letter-spacing: -.05em; line-height: 1.08; margin: 0.8em 0 0.3em; }
h2, .h2 { font-size: clamp(28px, 4vw, 44px); font-weight: 700; letter-spacing: -.025em; line-height: 1.12; margin: 0.7em 0 0.25em; }
h3, .h3 { font-size: clamp(20px, 2.5vw, 28px); font-weight: 600; letter-spacing: -.015em; line-height: 1.25; margin: 0.6em 0 0.2em; }
h4, .h4 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.35; margin: 0.5em 0 0.15em; }
body, p, .body { font-size: 15px; color: var(--dim); line-height: 1.65; }

/* ── Typography Scale ─────────────── */
.text-xs  { font-size: 11px; line-height: 1.5; }
.text-sm  { font-size: 13px; line-height: 1.55; }
.text-base { font-size: 15px; line-height: 1.65; }
.text-lg  { font-size: 17px; line-height: 1.55; }
.text-xl  { font-size: 20px; line-height: 1.45; }
.text-2xl { font-size: 24px; line-height: 1.35; }
.text-3xl { font-size: 32px; line-height: 1.2; letter-spacing: -.02em; }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.font-extrabold { font-weight: 800; }
.text-dim { color: var(--dim); }
.text-accent { color: var(--accent); }
.text-teal { color: var(--teal); }
.text-purple { color: var(--purple); }
.text-blue { color: var(--blue); }
.text-green { color: var(--green); }
.tracking-tight { letter-spacing: -.02em; }
.tracking-wide { letter-spacing: .04em; text-transform: uppercase; }
.leading-relaxed { line-height: 1.75; }
.leading-snug { line-height: 1.35; }
.text-balance { text-wrap: balance; }

::selection { background: var(--accent); color: #fff; }


/* ── Scrollbar ─────────────────────── */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.10); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.18); }
::-webkit-scrollbar-corner { background: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Nav ─────────────────────────── */
.gbt-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(0,0,0,.82);
  backdrop-filter: saturate(180%) blur(30px);
  -webkit-backdrop-filter: saturate(180%) blur(30px);
  border-bottom: 1px solid;
  border-image: linear-gradient(90deg, transparent, rgba(255,107,53,.2), transparent) 1;
  transition: border-image .4s ease, box-shadow .4s ease;
}
.gbt-nav.scrolled {
  border-image: linear-gradient(90deg, transparent, var(--accent), transparent) 1;
  box-shadow: 0 1px 20px rgba(255,107,53,.08);
}
.gbt-nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  height: 48px; max-width: 1200px; margin: 0 auto; padding: 0 24px;
}
.gbt-nav-brand {
  display: flex; align-items: center; gap: 8px;
  text-decoration: none; color: var(--fg); font-weight: 600; font-size: 15px;
}
.gbt-nav-brand svg { height: 24px; width: 24px; border-radius: 6px; }
.gbt-nav-links { display: flex; gap: 14px; }
.gbt-nav-links a {
  color: var(--dim); text-decoration: none; font-size: 12px; font-weight: 500;
  transition: color .2s;
}
.gbt-nav-links a:hover, .gbt-nav-links a.active { color: var(--fg); }

/* ── Buttons ──────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 30px; border-radius: 28px; font-size: 15px; font-weight: 600;
  text-decoration: none; border: none; cursor: pointer;
  transition: all .3s cubic-bezier(.16,1,.3,1);
  letter-spacing: -.01em; white-space: nowrap;
}
.btn-primary {
  background: var(--accent); color: #fff;
  box-shadow: 0 0 20px rgba(255,107,53,.15);
}
.btn-primary:hover {
  background: var(--accent2); transform: translateY(-1px);
  box-shadow: 0 6px 28px rgba(255,107,53,.3);
}
.btn-outline {
  background: transparent; color: var(--fg);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(8px);
}
.btn-outline:hover {
  border-color: rgba(255,255,255,.25);
  background: rgba(255,255,255,.04);
}
.btn-sm {
  padding: 8px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600;
  text-decoration: none; background: var(--accent); color: #fff;
  transition: all .25s cubic-bezier(.16,1,.3,1); border: none; cursor: pointer;
}
.btn-sm:hover { background: var(--accent2); transform: translateY(-1px); }
.btn-green {
  background: var(--green); color: #000;
}
.btn-green:hover { background: #34e062; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(48,209,88,.3); }
.btn-teal {
  background: var(--teal); color: #fff;
  box-shadow: 0 0 20px rgba(13,148,136,.15);
}
.btn-teal:hover {
  background: #0fb9a8; transform: translateY(-1px);
  box-shadow: 0 6px 28px rgba(13,148,136,.3);
}
.btn-purple {
  background: var(--purple); color: #fff;
  box-shadow: 0 0 20px rgba(124,58,237,.15);
}
.btn-purple:hover {
  background: #8b5cf6; transform: translateY(-1px);
  box-shadow: 0 6px 28px rgba(124,58,237,.3);
}
.btn-lg {
  padding: 16px 36px; border-radius: 32px; font-size: 16px;
}
.btn-xs {
  padding: 6px 14px; border-radius: var(--radius); font-size: 12px;
}

@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 20px rgba(255,107,53,.2); }
  50% { box-shadow: 0 0 40px rgba(255,107,53,.4), 0 0 80px rgba(255,107,53,.1); }
}

/* ── Animations ───────────────────── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(32px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-24px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(.92); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-8px); }
}
@keyframes pulse-ring {
  0%   { transform: scale(.9); opacity: .6; }
  100% { transform: scale(1.3); opacity: 0; }
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes pageIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.animate-fade-in-up  { animation: fadeInUp   .7s var(--ease-out-expo) both; }
.animate-fade-in     { animation: fadeIn      .5s var(--ease-out-expo) both; }
.animate-slide-right { animation: slideInRight .6s var(--ease-out-expo) both; }
.animate-scale-in    { animation: scaleIn     .5s var(--ease-out-expo) both; }
.animate-float       { animation: float       4s ease-in-out infinite; }
.animate-shimmer {
  background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,.06) 50%, transparent 75%);
  background-size: 200% 100%;
  animation: shimmer 2s infinite;
}
.stagger-1 { animation-delay: .1s; }
.stagger-2 { animation-delay: .2s; }
.stagger-3 { animation-delay: .3s; }
.stagger-4 { animation-delay: .4s; }
.stagger-5 { animation-delay: .5s; }

/* ── Layout ───────────────────────── */
.container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.section { padding: var(--section-lg) 0; }
.section-sm  { padding: var(--section-sm) 0; }
.section-md  { padding: var(--section-md) 0; }
.section-lg  { padding: var(--section-lg) 0; }
.section-xl  { padding: var(--section-xl) 0; }
.section-label {
  font-size: 12px; font-weight: 600; letter-spacing: 3px;
  color: var(--accent); text-transform: uppercase; margin-bottom: 16px;
}
.section h2 {
  font-size: clamp(32px, 5vw, 52px); font-weight: 700;
  letter-spacing: -.03em; margin-bottom: 16px; line-height: 1.1;
}
.section-sub {
  color: var(--dim); font-size: 16px; max-width: 480px;
  margin-bottom: 48px; line-height: 1.6;
}
.hl { color: var(--accent); }

/* Utility: gradient text via background-clip */
.text-gradient {
  background: linear-gradient(135deg, var(--accent), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.text-gradient-teal {
  background: linear-gradient(135deg, var(--accent), var(--teal));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Cards ────────────────────────── */
.card {
  position: relative; background: rgba(255,255,255,.01);
  border: 1px solid var(--glass-border);
  border-top: 1px solid rgba(255,255,255,.04);
  border-radius: var(--radius); padding: 28px;
  transition: all .35s cubic-bezier(.16,1,.3,1);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  overflow: hidden;
}
.card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--purple), transparent);
  border-radius: var(--radius) var(--radius) 0 0; opacity: .5;
}
.card:hover {
  border-color: var(--border-strong); transform: translateY(-4px) scale(1.02);
  box-shadow: var(--shadow-lift);
}
.card:hover::before { opacity: 1; }

/* Card Accent Variants */
.card-accent::before  { background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.card-teal::before    { background: linear-gradient(90deg, transparent, var(--teal), transparent); }
.card-purple::before  { background: linear-gradient(90deg, transparent, var(--purple), transparent); }
.card-blue::before    { background: linear-gradient(90deg, transparent, var(--blue), transparent); }
.card-green::before   { background: linear-gradient(90deg, transparent, var(--green), transparent); }
.card-accent:hover  { box-shadow: var(--shadow-glow-orange); }
.card-teal:hover    { box-shadow: var(--shadow-glow-teal); }
.card-purple:hover  { box-shadow: var(--shadow-glow-purple); }
.card-blue:hover    { box-shadow: var(--shadow-glow-blue); }
.card-green:hover   { box-shadow: var(--shadow-glow-green); }

.card-sm { padding: 20px; border-radius: var(--radius-sm); }
.card-lg { padding: 36px; border-radius: var(--radius-lg); }
.card-interactive { cursor: pointer; }
.card-interactive:hover { border-color: var(--border-strong); transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-lift); }
.card-interactive:hover::before { opacity: 1; }

/* ── Footer ───────────────────────── */
.gbt-footer {
  padding: 64px 0 40px;
  border-top: 2px solid transparent;
  border-image: linear-gradient(90deg, rgba(255,107,53,.35), rgba(41,151,255,.35), rgba(48,209,88,.35)) 1;
  background: linear-gradient(180deg, var(--bg) 0%, rgba(10,10,18,.97) 100%);
}
.gbt-footer-grid {
  display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px;
  margin-bottom: 40px;
}
.gbt-footer h5 {
  font-size: 12px; font-weight: 600; letter-spacing: 1px;
  color: var(--fg); margin-bottom: 12px; text-transform: uppercase;
}
.gbt-footer a {
  color: var(--dim); text-decoration: none; font-size: 13px;
  display: block; margin-bottom: 6px; line-height: 1.8;
}
.gbt-footer a:hover { color: var(--accent); }
.gbt-footer-bottom {
  padding-top: 24px; border-top: 1px solid rgba(255,255,255,.06);
  display: flex; justify-content: space-between; color: var(--dim);
  font-size: 12px; flex-wrap: wrap; gap: 12px;
}

/* Back to top */
.gbt-back-to-top {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--dim); cursor: pointer;
  transition: all .25s ease; padding: 6px 12px;
  border-radius: var(--radius); background: transparent;
  border: 1px solid transparent; text-decoration: none;
  margin-bottom: 12px;
}
.gbt-back-to-top svg { width: 14px; height: 14px; transition: transform .25s ease; }
.gbt-back-to-top:hover { color: var(--accent); border-color: rgba(255,107,53,.15); }
.gbt-back-to-top:hover svg { transform: translateY(-2px); }
.gbt-footer-badges { display: flex; gap: 16px; flex-wrap: wrap; }
.trust-badge {
  font-size: 11px; padding: 5px 12px; border-radius: var(--radius);
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07);
  color: var(--dim); letter-spacing: .3px;
  transition: all .25s ease; white-space: nowrap;
}
.trust-badge:hover {
  border-color: rgba(48,209,88,.25);
  color: var(--fg);
  background: rgba(48,209,88,.06);
}

/* ── Stats Bar ────────────────────── */
.stats { display: flex; justify-content: center; gap: 0; padding: 48px 0; flex-wrap: wrap; }
.stat { text-align: center; padding: 0 48px; border-left: 1px solid rgba(255,255,255,.06); transition: transform .35s cubic-bezier(.16,1,.3,1); position: relative; }
.stat:first-child { border-left: none; }
.stat:hover { transform: translateY(-3px); }
.stat-num { font-size: 48px; font-weight: 800; line-height: 1; transition: all .35s cubic-bezier(.16,1,.3,1); position: relative; }
.stat-num.g { color: var(--green); text-shadow: 0 0 20px rgba(48,209,88,.15); }
.stat-num.o { color: var(--accent); text-shadow: 0 0 20px rgba(255,107,53,.15); }
.stat-num.b { color: var(--blue); text-shadow: 0 0 20px rgba(41,151,255,.15); }
.stat-num.t { color: var(--teal); text-shadow: 0 0 20px rgba(13,148,136,.15); }
.stat:hover .stat-num.g { text-shadow: 0 0 32px rgba(48,209,88,.3); }
.stat:hover .stat-num.o { text-shadow: 0 0 32px rgba(255,107,53,.3); }
.stat:hover .stat-num.b { text-shadow: 0 0 32px rgba(41,151,255,.3); }
.stat:hover .stat-num.t { text-shadow: 0 0 32px rgba(13,148,136,.3); }
.stat-label { font-size: 11px; font-weight: 500; color: var(--dim); margin-top: 8px; letter-spacing: 2px; text-transform: uppercase; }

/* ── Utility ──────────────────────── */
.reveal { opacity: 1; transform: translateY(40px); transition: all .7s cubic-bezier(.16,1,.3,1); }
.reveal.visible { opacity: 1; transform: translateY(0); filter: blur(0); }

/* Stagger delays for card grids — 0.1s per sibling */
.card.reveal:nth-child(1)  { transition-delay: 0s; }
.card.reveal:nth-child(2)  { transition-delay: .1s; }
.card.reveal:nth-child(3)  { transition-delay: .2s; }
.card.reveal:nth-child(4)  { transition-delay: .3s; }
.card.reveal:nth-child(5)  { transition-delay: .4s; }
.card.reveal:nth-child(6)  { transition-delay: .5s; }
.card.reveal:nth-child(7)  { transition-delay: .6s; }
.card.reveal:nth-child(8)  { transition-delay: .7s; }
.card.reveal:nth-child(9)  { transition-delay: .8s; }
.card.reveal:nth-child(10) { transition-delay: .9s; }
.text-center { text-align: center; }
.mt-48 { margin-top: 48px; }

/* Spacing Helpers */
.mt-0  { margin-top: 0; }
.mt-8  { margin-top: var(--space-sm); }
.mt-16 { margin-top: var(--space-md); }
.mt-24 { margin-top: var(--space-lg); }
.mt-32 { margin-top: var(--space-xl); }
.mt-64 { margin-top: var(--space-3xl); }
.mb-0  { margin-bottom: 0; }
.mb-8  { margin-bottom: var(--space-sm); }
.mb-16 { margin-bottom: var(--space-md); }
.mb-24 { margin-bottom: var(--space-lg); }
.mb-32 { margin-bottom: var(--space-xl); }
.mb-48 { margin-bottom: var(--space-2xl); }
.mb-64 { margin-bottom: var(--space-3xl); }
.pt-0  { padding-top: 0; }
.pt-16 { padding-top: var(--space-md); }
.pt-32 { padding-top: var(--space-xl); }
.pb-0  { padding-bottom: 0; }
.pb-16 { padding-bottom: var(--space-md); }
.pb-32 { padding-bottom: var(--space-xl); }
.gap-8  { gap: var(--space-sm); }
.gap-12 { gap: 12px; }
.gap-16 { gap: var(--space-md); }
.gap-24 { gap: var(--space-lg); }
.gap-32 { gap: var(--space-xl); }
.gap-48 { gap: var(--space-2xl); }

/* Flex & Grid Helpers */
.flex       { display: flex; }
.flex-col   { display: flex; flex-direction: column; }
.flex-wrap  { flex-wrap: wrap; }
.items-center { align-items: center; }
.justify-center { justify-content: center; }
.justify-between { justify-content: space-between; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-lg); }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-lg); }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-lg); }

/* Visibility */
.hidden-mobile { }
.hidden-desktop { }

/* Misc */
.w-full { width: 100%; }
.relative { position: relative; }
.overflow-hidden { overflow: hidden; }

/* ── Glass Morphism Card ─── */
.glass-card {
  background: rgba(255,255,255,.02);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: var(--radius);

  transition: all .3s cubic-bezier(.16,1,.3,1);

  background: rgba(255,255,255,.04);
  border-color: rgba(255,255,255,.12);
  transform: translateY(-2px);
  box-shadow: 0 16px 48px rgba(0,0,0,.4), 0 0 0 1px rgba(124,58,237,.1);
}

/* ── Glow Border ─── */
.glow-border {
  position: relative;
}
.glow-border::after {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(124,58,237,.3), rgba(6,182,212,.3), rgba(255,107,53,.2));
  z-index: -1;
  opacity: 0;
  transition: opacity .4s cubic-bezier(.16,1,.3,1);
}
.glow-border:hover::after { opacity: 1; }

/* ── Scan Line Overlay ─── */
.scan-lines {
  position: relative;
  overflow: hidden;
}
.scan-lines::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(255,255,255,.008) 2px,
    rgba(255,255,255,.008) 4px
  );
  pointer-events: none;
  z-index: 1;
}

/* ── Tech Grid Background ─── */
.tech-grid {
  background-image:

    linear-gradient(90deg, rgba(124,58,237,.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ── Pulsing Dot ─── */
.pulse-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px rgba(48,209,88,.6);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .4; transform: scale(1.5); }
}

/* ── Gradient Text ─── */
.text-gradient {
  background: linear-gradient(135deg, #a78bfa, #06b6d4, #f97316);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Animated Counter ─── */
.count-up { font-variant-numeric: tabular-nums; }

/* ── Divider Glow ─── */
.divider-glow {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(124,58,237,.3), rgba(6,182,212,.3), transparent);
  border: none;
  margin: var(--space-16) 0;
}

/* ── Hover Lift ─── */
.hover-lift {
  transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s cubic-bezier(.16,1,.3,1);
}
.hover-lift:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

/* ── Floating Animation ─── */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.float { animation: float 6s ease-in-out infinite; }

/* ── Neon Glow Text ─── */

  text-shadow: 0 0 20px rgba(124,58,237,.5), 0 0 40px rgba(124,58,237,.2);

/* ─── Search ─── */
function doSearch() {
  const q = $('search').value.trim().toLowerCase();
  const drop = $('sdrop');
  if (!q) { drop.classList.remove('active'); return; }

  const results = TOOLS.map(t => {
    const inName = t.name.toLowerCase().includes(q);
    const inDesc = t.desc.toLowerCase().includes(q);
    const inSearch = (t.search||[]).some(s=>s.toLowerCase().includes(q)||q.includes(s.toLowerCase()));
    const score = (inName?30:0)+(inSearch?20:0)+(inDesc?10:0);
    return {tool:t, score};
  }).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,8);

  if (results.length === 0) {
    drop.innerHTML = '<div class="search-empty">😕 没找到匹配的工具，试试「压缩图片」「生成UUID」「查DNS」</div>';
  } else {
    drop.innerHTML = results.map(r => {
      const t = r.tool;
      return `<div class="search-item" onclick="openTool('${t.id}');$('search').value='';$('sdrop').classList.remove('active');">
        <div class="si-icon">${t.icon}</div>
        <div class="si-info">
          <div class="si-name">${t.name}</div>
          <div class="si-desc">${t.desc}</div>
        </div>
        <div class="si-cap">${t.cap}</div>
      </div>`;
    }).join('');
  }
  drop.classList.add('active');
}

function onSearchKey(e) {
  if (e.key === 'Escape') { $('search').value=''; $('sdrop').classList.remove('active'); $('search').blur(); }
  if (e.key === 'Enter') { const first = document.querySelector('.search-item'); if(first) first.click(); }
}

// Ctrl+K
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='k') { e.preventDefault(); $('search').focus(); $('search').select(); }
});

// Close search on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) $('sdrop').classList.remove('active');
});

/* ─── Tabs & Cards ─── */
function $(id){return document.getElementById(id);}
function renderTabs() {
  $('tabs').innerHTML = CATS.map(c=>`<div class="tab${c.id===active?' active':''}" onclick="filter('${c.id}')">${c.icon} ${c.name}</div>`).join('');
}
function filter(c){ active=c; renderTabs(); renderCards(); }
function renderCards() {
  const tools = active==='all'?TOOLS:TOOLS.filter(t=>t.cat===active);
  const empty = tools.length===0 ? '<div style="text-align:center;padding:40px;color:var(--text2);grid-column:1/-1;">该分类暂无工具，用搜索直接找吧 🔍</div>' : '';
  $('grid').innerHTML = empty + tools.map(t=>`
    <div class="card" onclick="openTool('${t.id}')">
      <div class="card-top">
        <div class="card-icon">${t.icon}</div>
        <div class="card-info"><h3>${t.name}</h3><p>${t.desc}</p></div>
      </div>
      <div class="card-tags"><span class="tag cap">${t.cap}</span>${(t.cat?`<span class="tag">${t.cat}</span>`:'')}</div>
    </div>
  `).join('');
}

/* ─── Tool Panel ─── */
function openTool(id) {
  const t = TOOLS.find(t=>t.id===id);
  if(!t) return;
  $('panel').innerHTML = `<h3>${t.icon} ${t.name}<span style="color:var(--text2);font-size:12px;margin-left:8px;">${t.cap}</span><button class="close" onclick="closePanel()">×</button></h3>
    <p style="color:var(--text2);font-size:13px;margin-bottom:12px;">${t.desc} — 调用: <code style="background:var(--bg);padding:2px 6px;border-radius:4px;">python caps/${t.cap}/run.py ${t.id.replace(t.cap+'-','')} '{}'</code></p>
    ${renderPanel(t)}`;
  $('overlay').classList.add('active');
}
function closePanel(){ $('overlay').classList.remove('active'); }

function renderPanel(t) {
  switch(t.id) {
    case 'json': return `<textarea id="jin" rows="5" placeholder="输入 JSON..."></textarea>
      <div class="row"><button class="btn sm" onclick="doJson('format')">格式化</button><button class="btn sm" onclick="doJson('compact')">压缩</button><button class="btn sm" onclick="doJson('validate')">验证</button></div><div class="output" id="out"></div>`;
    case 'base64': return `<textarea id="jin" rows="4" placeholder="输入文本..."></textarea>
      <div class="row"><button class="btn sm" onclick="doB64('encode')">编码</button><button class="btn sm" onclick="doB64('decode')">解码</button></div><div class="output" id="out"></div>`;
    case 'url': return `<textarea id="jin" rows="4" placeholder="输入文本..."></textarea>
      <div class="row"><button class="btn sm" onclick="doUrl('encode')">编码</button><button class="btn sm" onclick="doUrl('decode')">解码</button></div><div class="output" id="out"></div>`;
    case 'hash': return `<textarea id="jin" rows="3" placeholder="输入文本..."></textarea>
      <div class="row"><select id="halgo"><option>md5</option><option>sha1</option><option>sha256</option></select><button class="btn sm" onclick="doHash()">计算</button></div><div class="output" id="out"></div>`;
    case 'ts': return `<input id="jin" placeholder="输入时间戳(秒) 或 日期..."><button class="btn sm" style="margin-top:8px;" onclick="doTs()">转换</button><div class="output" id="out"></div>`;
    case 'uuid': return `<button class="btn" onclick="doUuid()">生成 UUID v4</button><div class="output" id="out" style="margin-top:8px;"></div>`;
    case 'qrcode': return `<textarea id="jin" rows="3" placeholder="输入文本或 URL..."></textarea><button class="btn sm" style="margin-top:8px;" onclick="doQr()">生成</button><div id="out" style="margin-top:12px;text-align:center;"></div>`;
    case 'diff': return `<textarea id="jin" rows="3" placeholder="原始文本..."></textarea><div style="color:var(--text2);margin:8px 0;text-align:center;">VS</div><textarea id="jin2" rows="3" placeholder="对比文本..."></textarea><button class="btn sm" style="margin-top:8px;" onclick="doDiff()">对比</button><div class="output" id="out"></div>`;
    case 'regex': return `<input id="jin" placeholder="正则表达式"><textarea id="jin2" rows="4" style="margin-top:8px;" placeholder="测试文本..."></textarea><div class="row"><button class="btn sm" onclick="doRegex('match')">匹配</button><button class="btn sm" onclick="doRegex('replace')">替换</button><input id="jin3" placeholder="替换为..." style="width:100px;"></div><div class="output" id="out"></div>`;
    case 'dns': return `<input id="jin" placeholder="域名, 如 github.com"><div class="row"><select id="dtype"><option>A</option><option>MX</option><option>NS</option><option>TXT</option><option>AAAA</option></select><button class="btn sm" onclick="quickCap('netter','dns')">查询</button></div><div class="output" id="out"></div>`;
    case 'ping': return `<div class="row"><input id="jin" placeholder="主机, 如 github.com"><input id="jin2" placeholder="端口, 如 443" style="width:80px;"><button class="btn sm" onclick="quickCap('netter','ping')">检测</button></div><div class="output" id="out"></div>`;
    case 'http': return `<div class="row"><select id="hmethod"><option>GET</option><option>POST</option></select><input id="jin" placeholder="URL"><button class="btn sm" onclick="quickCap('netter','http')">发送</button></div><textarea id="jin2" rows="3" style="margin-top:8px;" placeholder="POST Body (JSON)..."></textarea><div class="output" id="out"></div>`;
    case 'password': return `<div class="row"><input id="jin" placeholder="长度(默认16)" value="16" style="width:80px;"><button class="btn sm" onclick="quickCap('secer','password')">生成</button></div><div class="output" id="out"></div>`;
    case 'unit': return `<div class="row"><input id="jin" placeholder="数值" style="width:100px;"><select id="ufrom"><option>m</option><option>km</option><option>cm</option><option>kg</option><option>g</option><option>c</option><option>f</option></select><span>→</span><select id="uto"><option>km</option><option>m</option><option>cm</option><option>g</option><option>kg</option><option>f</option><option>c</option></select><button class="btn sm" onclick="quickCap('verter','unit')">换算</button></div><div class="output" id="out"></div>`;
    case 'cron': return `<input id="jin" placeholder="如: every hour / every monday at 9am / every 30 minutes"><button class="btn sm" style="margin-top:8px;" onclick="quickCap('auter','cron')">生成</button><div class="output" id="out"></div>`;
    default: return `<p style="color:var(--text2);">此工具需通过命令行使用：</p><div class="output"><code>python caps/${t.cap}/run.py ${t.id.replace(t.cap+'-','')} '{}'</code></div>`;
  }
}

/* ─── Tool Functions ─── */
function copy(el){const t=el.parentElement.textContent.replace('复制','').trim();navigator.clipboard.writeText(t);el.textContent='已复制!';setTimeout(()=>el.textContent='复制',1200);}
function doJson(a){try{const o=JSON.parse($('jin').value);$('out').innerHTML='<span class="copy" onclick="copy(this)">复制</span>'+(a==='format'?JSON.stringify(o,null,2):a==='compact'?JSON.stringify(o):'✅ 有效 JSON');}catch(e){$('out').innerHTML='❌ '+e.message;}}
function doB64(a){try{const r=a==='encode'?btoa(unescape(encodeURIComponent($('jin').value))):decodeURIComponent(escape(atob($('jin').value)));$('out').innerHTML='<span class="copy" onclick="copy(this)">复制</span>'+r;}catch(e){$('out').innerHTML='❌ '+e.message;}}
function doUrl(a){$('out').innerHTML='<span class="copy" onclick="copy(this)">复制</span>'+(a==='encode'?encodeURIComponent($('jin').value):decodeURIComponent($('jin').value));}
function doDiff(){const a=$('jin').value.split('\n'),b=(document.getElementById('jin2')||{value:''}).value.split('\n'),m=Math.max(a.length,b.length);let h='';for(let i=0;i<m;i++){if(a[i]===b[i])h+=`<span style="color:var(--text2)">  ${a[i]||''}</span>\n`;else h+=`<span style="color:var(--red)">- ${a[i]||''}</span>\n<span style="color:var(--green)">+ ${b[i]||''}</span>\n`;}$('out').innerHTML=h;}
async function doHash(){const t=$('jin').value,a=$('halgo').value.toUpperCase();let r;if(a==='MD5'){r='MD5 需后端';}else{const b=await crypto.subtle.digest('SHA-'+(a==='SHA256'?'256':'1'),new TextEncoder().encode(t));r=Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}$('out').innerHTML='<span class="copy" onclick="copy(this)">复制</span>'+r;}
function doTs(){const v=$('jin').value.trim();let r;if(/^\d{10,13}$/.test(v)){const d=new Date(v.length===10?v*1000:v*1);r=d.toLocaleString('zh-CN');}else{const d=new Date(v);if(isNaN(d.getTime()))r='❌ 无效';else r='Unix秒: '+Math.floor(d.getTime()/1000);}$('out').innerHTML=r;}
function doUuid(){$('out').innerHTML='<span class="copy" onclick="copy(this)">复制</span>'+crypto.randomUUID();}
function doQr(){const t=$('jin').value;if(!t)return;const d=$('out');d.innerHTML='<div style="background:white;display:inline-block;padding:12px;border-radius:8px;"></div>';const i=document.createElement('img');i.src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(t);i.style.display='block';d.firstChild.appendChild(i);}
function doRegex(a){try{const re=new RegExp($('jin').value,'g'),t=$('jin2').value;if(a==='match'){const m=[...t.matchAll(re)].map(x=>x[0]);$('out').innerHTML=m.length?'匹配 '+m.length+' 项:\n'+m.join('\n'):'无匹配';}else{$('out').innerHTML='<span class="copy" onclick="copy(this)">复制</span>'+t.replace(re,$('jin3').value);}}catch(e){$('out').innerHTML='❌ '+e.message;}}
