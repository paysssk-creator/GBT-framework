<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(255,107,53,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8b86d"/>
      <stop offset="50%" stop-color="#d4953a"/>
      <stop offset="100%" stop-color="#b8752a"/>
    </linearGradient>
    <linearGradient id="body2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ff9a56"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <rect width="512" height="512" rx="80" fill="url(#glow)"/>

  <!-- Potato body -->
  <g filter="url(#shadow)">
    <ellipse cx="256" cy="190" rx="110" ry="85" fill="url(#body)"/>
    <ellipse cx="256" cy="190" rx="110" ry="85" fill="url(#body2)"/>
  </g>

  <!-- Potato texture spots -->
  <ellipse cx="210" cy="220" rx="15" ry="8" fill="rgba(139,90,43,0.2)" transform="rotate(-15 210 220)"/>
  <ellipse cx="290" cy="175" rx="10" ry="6" fill="rgba(139,90,43,0.15)" transform="rotate(12 290 175)"/>
  <ellipse cx="240" cy="155" rx="8" ry="4" fill="rgba(139,90,43,0.12)" transform="rotate(-8 240 155)"/>

  <!-- Eyes -->
  <ellipse cx="218" cy="178" rx="18" ry="20" fill="#1a1a2e"/>
  <ellipse cx="294" cy="178" rx="18" ry="20" fill="#1a1a2e"/>
  <!-- Eye shine -->
  <circle cx="224" cy="172" r="7" fill="rgba(255,255,255,0.8)"/>
  <circle cx="300" cy="172" r="7" fill="rgba(255,255,255,0.8)"/>
  <circle cx="228" cy="168" r="3" fill="#fff"/>
  <circle cx="304" cy="168" r="3" fill="#fff"/>

  <!-- Smile -->
  <path d="M 225 205 Q 256 230 287 205" stroke="#1a1a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="195" cy="200" rx="12" ry="8" fill="rgba(255,107,53,0.2)"/>
  <ellipse cx="317" cy="200" rx="12" ry="8" fill="rgba(255,107,53,0.2)"/>

  <!-- Crown/hat -->
  <path d="M 200 120 L 220 90 L 240 115 L 256 80 L 272 115 L 292 90 L 312 120 Z" fill="url(#accent)" filter="url(#shadow)"/>
  <rect x="195" y="118" width="122" height="8" rx="4" fill="url(#accent)"/>

  <!-- Brand text -->
  <text x="256" y="330" text-anchor="middle" font-family="'Segoe UI Black','Arial Black',sans-serif" font-size="64" font-weight="900" fill="url(#accent)" filter="url(#textGlow)" letter-spacing="4">GBT</text>

  <!-- Subtitle -->
  <text x="256" y="380" text-anchor="middle" font-family="'Segoe UI','Arial',sans-serif" font-size="28" fill="#86868b" font-weight="600" letter-spacing="6">小 土 豆</text>

  <!-- Tagline -->
  <text x="256" y="425" text-anchor="middle" font-family="'Segoe UI','Arial',sans-serif" font-size="16" fill="#5a5a6e" letter-spacing="3">AI INTELLIGENCE</text>

  <!-- Decorative dots -->
  <circle cx="140" cy="130" r="3" fill="rgba(255,107,53,0.3)"/>
  <circle cx="380" cy="130" r="3" fill="rgba(255,107,53,0.3)"/>
  <circle cx="145" cy="400" r="2" fill="rgba(255,255,255,0.1)"/>
  <circle cx="370" cy="395" r="2" fill="rgba(255,255,255,0.1)"/>
</svg>
