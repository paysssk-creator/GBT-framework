# GBT API · 永久隧道配置
# cloudflared config.yml — 生产级持久隧道
# 替代 trycloudflare.com 临时隧道，支持 SSE/WebSocket/长连接

tunnel: gbt-api-tunnel
credentials-file: C:\Users\ADMIN\.cloudflared\gbt-api-tunnel.json

# ═══════════════ Ingress Rules ═══════════════
# 流量路由: 公网域名 → 本地服务

ingress:
  # 主 API 服务 (web_api/run.py → localhost:9878)
  - hostname: api-tunnel.gbtxiaotudou.com
    service: http://localhost:9878
    originRequest:
      # 30秒超时 — 眼睛截图/视觉分析需要
      connectTimeout: 30s
      noTLSVerify: true

  # 部署代理 (deploy_me.py → localhost:15888)
  - hostname: deploy-tunnel.gbtxiaotudou.com
    service: http://localhost:15888
    originRequest:
      connectTimeout: 30s
      noTLSVerify: true

  # 兜底: 404
  - service: http_status:404

# ═══════════════ 性能调优 ═══════════════
# 长连接支持 (眼睛实时流需要)
protocol: quic

# 日志
loglevel: info

# 优雅关闭
grace-period: 10s
