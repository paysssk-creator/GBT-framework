name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 82dd88c2a3907846e9797ea95419802f
          command: pages deploy web --project-name=gbtxiaotudou --branch=main --commit-dirty=true
