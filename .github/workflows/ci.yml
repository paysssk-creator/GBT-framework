name: GBT小土豆 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 8 * * *'  # 每天UTC 8:00自动运行

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
        sudo apt-get install -y xvfb scrot  # 虚拟显示(无头环境pyautogui需要)

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run smoke tests
      run: |
        pytest tests/test_caps.py -v --tb=short --timeout=120 -k "not (desktop_master or sys_control or screenshot)" 2>&1

    - name: Syntax check all caps
      run: |
        python -c "
        import py_compile, os
        errors = []
        for root, dirs, files in os.walk('caps'):
            for f in files:
                if f == 'run.py':
                    fp = os.path.join(root, f)
                    try:
                        py_compile.compile(fp, doraise=True)
                    except py_compile.PyCompileError as e:
                        errors.append(f'{fp}: {e}')
        if errors:
            print(f'❌ {len(errors)} syntax errors:')
            for e in errors: print(f'  {e}')
            exit(1)
        print(f'✅ All caps syntax OK')
        "

    - name: Validate capability.json files
      run: |
        python -c "
        import json, os, sys
        errors = []
        for d in os.listdir('caps'):
            cj = os.path.join('caps', d, 'capability.json')
            if os.path.exists(cj):
                try:
                    data = json.load(open(cj))
                    assert 'name' in data, 'missing name'
                    assert data['name'] == d, f'name mismatch: {data[\"name\"]} != {d}'
                    assert 'actions' in data, 'missing actions'
                    assert len(data['actions']) > 0, 'empty actions'
                except Exception as e:
                    errors.append(f'{d}: {e}')
        if errors:
            print(f'❌ {len(errors)} capability.json errors:')
            for e in errors: print(f'  {e}')
            exit(1)
        print(f'✅ All capability.json valid')
        "

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: ruff check caps/ brain/ tests/ --select=E,F,W --ignore=E501
    - run: ruff check *.py --select=E,F,W --ignore=E501
